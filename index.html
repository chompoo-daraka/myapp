<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>บีนส์ | จดออเดอร์</title>
<style>
  :root {
    --brown-darkest: #3b2418;
    --brown-dark: #5c3a28;
    --brown: #7b4b32;
    --brown-mid: #a9724f;
    --brown-light: #d9b48f;
    --cream: #f7ede1;
    --cream-2: #fffaf3;
    --accent: #c1793a;
    --accent-dark: #8f5a26;
    --danger: #b6412c;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Segoe UI", "Sarabun", "Tahoma", sans-serif;
    background: linear-gradient(180deg, var(--brown-darkest), var(--brown-dark) 40%, var(--cream) 40%);
    background-attachment: fixed;
    color: var(--brown-darkest);
    padding-bottom: 40px;
  }

  header {
    text-align: center;
    padding: 28px 16px 18px;
    color: var(--cream-2);
  }

  header h1 {
    margin: 0;
    font-size: 2.1em;
    letter-spacing: 2px;
  }

  header p {
    margin: 6px 0 0;
    color: var(--brown-light);
    font-size: 0.95em;
  }

  .container {
    max-width: 640px;
    margin: 0 auto;
    padding: 0 14px;
  }

  .card {
    background: var(--cream-2);
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(59, 36, 24, 0.25);
    padding: 18px;
    margin-bottom: 18px;
    border: 1px solid var(--brown-light);
  }

  .card h2 {
    margin: 0 0 12px;
    color: var(--brown-dark);
    font-size: 1.15em;
    border-bottom: 2px solid var(--brown-light);
    padding-bottom: 8px;
  }

  .menu-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 6px;
    border-bottom: 1px dashed var(--brown-light);
  }

  .menu-item:last-child { border-bottom: none; }

  .menu-info {
    flex: 1;
  }

  .menu-name {
    font-weight: 600;
    color: var(--brown-darkest);
  }

  .menu-price {
    color: var(--brown-mid);
    font-size: 0.9em;
  }

  .qty-control {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .qty-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: none;
    background: var(--brown);
    color: white;
    font-size: 1.2em;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
  }

  .qty-btn:active { background: var(--brown-dark); }

  .qty-value {
    min-width: 26px;
    text-align: center;
    font-weight: 700;
    font-size: 1.05em;
  }

  .form-group {
    margin-bottom: 12px;
  }

  label {
    display: block;
    margin-bottom: 5px;
    font-size: 0.9em;
    color: var(--brown-dark);
    font-weight: 600;
  }

  input[type="text"], input[type="tel"] {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid var(--brown-light);
    border-radius: 10px;
    font-size: 1em;
    background: var(--cream);
    color: var(--brown-darkest);
  }

  input:focus {
    outline: none;
    border-color: var(--accent);
  }

  .total-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 1.3em;
    font-weight: 700;
    color: var(--brown-dark);
    margin: 8px 0 16px;
    padding: 12px;
    background: var(--brown-light);
    border-radius: 10px;
  }

  .total-row span:last-child {
    color: var(--accent-dark);
  }

  .save-btn {
    width: 100%;
    padding: 14px;
    font-size: 1.1em;
    font-weight: 700;
    color: white;
    background: linear-gradient(180deg, var(--accent), var(--accent-dark));
    border: none;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(143, 90, 38, 0.4);
  }

  .save-btn:active { transform: translateY(1px); }

  .empty-msg {
    text-align: center;
    color: var(--brown-mid);
    padding: 20px;
    font-style: italic;
  }

  .order-entry {
    background: var(--cream);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
    border-left: 5px solid var(--accent);
    position: relative;
  }

  .order-entry .order-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 4px;
  }

  .order-entry .customer {
    font-weight: 700;
    color: var(--brown-darkest);
  }

  .order-entry .time {
    font-size: 0.8em;
    color: var(--brown-mid);
  }

  .order-entry .phone {
    font-size: 0.85em;
    color: var(--brown-mid);
    margin: 2px 0 6px;
  }

  .order-entry ul {
    margin: 4px 0;
    padding-left: 18px;
    font-size: 0.92em;
  }

  .order-entry .order-total {
    margin-top: 6px;
    font-weight: 700;
    color: var(--accent-dark);
    text-align: right;
  }

  .del-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    background: none;
    border: none;
    color: var(--danger);
    font-size: 1em;
    cursor: pointer;
    padding: 4px 8px;
  }

  .clear-all {
    display: block;
    margin: 8px auto 0;
    background: none;
    border: 1.5px solid var(--danger);
    color: var(--danger);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.85em;
  }

  .summary-bar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: linear-gradient(180deg, var(--accent-dark), var(--brown-dark));
    color: var(--cream-2);
    text-align: center;
    padding: 10px 14px;
    font-weight: 700;
    font-size: 0.98em;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
  }

  .summary-bar .summary-amount {
    color: #ffd9a0;
  }
</style>
</head>
<body>

<div class="summary-bar" id="summaryBar">ยอดขายวันนี้รวม 0 บาท · 0 ออเดอร์</div>

<header>
  <h1>☕ บีนส์</h1>
  <p>ระบบจดออเดอร์ร้านกาแฟ</p>
</header>

<div class="container">

  <div class="card">
    <h2>เมนู</h2>
    <div id="menuList"></div>
  </div>

  <div class="card">
    <h2>ข้อมูลลูกค้า</h2>
    <div class="form-group">
      <label for="customerName">ชื่อลูกค้า</label>
      <input type="text" id="customerName" placeholder="เช่น คุณสมชาย">
    </div>
    <div class="form-group">
      <label for="customerPhone">เบอร์โทร</label>
      <input type="tel" id="customerPhone" placeholder="เช่น 081-234-5678">
    </div>

    <div class="total-row">
      <span>ยอดรวม</span>
      <span id="totalPrice">0 บาท</span>
    </div>

    <button class="save-btn" id="saveBtn">บันทึกออเดอร์</button>
  </div>

  <div class="card">
    <h2>รายการออเดอร์ที่บันทึกแล้ว</h2>
    <div id="orderHistory"></div>
    <button class="clear-all" id="clearAllBtn" style="display:none;">ล้างรายการทั้งหมด</button>
  </div>

</div>

<script>
  const MENU = [
    { id: "americano", name: "อเมริกาโน่", price: 55 },
    { id: "latte", name: "ลาเต้", price: 65 },
    { id: "cappuccino", name: "คาปูชิโน่", price: 65 },
    { id: "thaitea", name: "ชาไทย", price: 50 },
    { id: "cocoa", name: "โกโก้", price: 60 },
    { id: "bananacake", name: "เค้กกล้วยหอม", price: 45 }
  ];

  const STORAGE_KEY = "beans_coffee_orders";
  const qty = {};
  MENU.forEach(item => qty[item.id] = 0);

  const menuListEl = document.getElementById("menuList");
  const totalPriceEl = document.getElementById("totalPrice");
  const orderHistoryEl = document.getElementById("orderHistory");
  const clearAllBtn = document.getElementById("clearAllBtn");
  const summaryBarEl = document.getElementById("summaryBar");

  function todayKey() {
    const d = new Date();
    const pad = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }

  function renderMenu() {
    menuListEl.innerHTML = MENU.map(item => `
      <div class="menu-item">
        <div class="menu-info">
          <div class="menu-name">${item.name}</div>
          <div class="menu-price">${item.price} บาท</div>
        </div>
        <div class="qty-control">
          <button type="button" class="qty-btn" data-action="dec" data-id="${item.id}">−</button>
          <span class="qty-value" id="qty-${item.id}">${qty[item.id]}</span>
          <button type="button" class="qty-btn" data-action="inc" data-id="${item.id}">+</button>
        </div>
      </div>
    `).join("");
  }

  function updateTotal() {
    let total = 0;
    MENU.forEach(item => {
      total += item.price * qty[item.id];
    });
    totalPriceEl.textContent = total.toLocaleString("th-TH") + " บาท";
    return total;
  }

  menuListEl.addEventListener("click", (e) => {
    const btn = e.target.closest(".qty-btn");
    if (!btn) return;
    const id = btn.dataset.id;
    if (btn.dataset.action === "inc") {
      qty[id]++;
    } else if (btn.dataset.action === "dec") {
      qty[id] = Math.max(0, qty[id] - 1);
    }
    document.getElementById("qty-" + id).textContent = qty[id];
    updateTotal();
  });

  function loadOrders() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (err) {
      return [];
    }
  }

  function saveOrders(orders) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(orders));
  }

  function updateSummary() {
    const orders = loadOrders();
    const key = todayKey();
    const todayOrders = orders.filter(o => o.dateKey === key);
    const todayTotal = todayOrders.reduce((sum, o) => sum + o.total, 0);
    summaryBarEl.innerHTML = `ยอดขายวันนี้รวม <span class="summary-amount">${todayTotal.toLocaleString("th-TH")} บาท</span> · ${todayOrders.length} ออเดอร์`;
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function renderHistory() {
    const orders = loadOrders();
    if (orders.length === 0) {
      orderHistoryEl.innerHTML = '<div class="empty-msg">ยังไม่มีออเดอร์ที่บันทึกไว้</div>';
      clearAllBtn.style.display = "none";
      return;
    }
    clearAllBtn.style.display = "block";
    orderHistoryEl.innerHTML = orders.slice().reverse().map(order => {
      const itemsHtml = order.items.map(it =>
        `<li>${escapeHtml(it.name)} x${it.qty} = ${(it.price * it.qty).toLocaleString("th-TH")} บาท</li>`
      ).join("");
      const nameDisplay = order.customerName ? escapeHtml(order.customerName) : "ลูกค้าไม่ระบุชื่อ";
      const phoneDisplay = order.customerPhone ? `📞 ${escapeHtml(order.customerPhone)}` : "";
      return `
        <div class="order-entry" data-order-id="${order.id}">
          <button class="del-btn" data-del-id="${order.id}" title="ลบรายการนี้">✕</button>
          <div class="order-head">
            <span class="customer">${nameDisplay}</span>
            <span class="time">${escapeHtml(order.time)}</span>
          </div>
          <div class="phone">${phoneDisplay}</div>
          <ul>${itemsHtml}</ul>
          <div class="order-total">รวม ${order.total.toLocaleString("th-TH")} บาท</div>
        </div>
      `;
    }).join("");
  }

  orderHistoryEl.addEventListener("click", (e) => {
    const delBtn = e.target.closest(".del-btn");
    if (!delBtn) return;
    const id = delBtn.dataset.delId;
    const orders = loadOrders();
    const target = orders.find(o => String(o.id) === String(id));
    const label = target
      ? `ออเดอร์ของ ${target.customerName || "ลูกค้าไม่ระบุชื่อ"} (${target.total.toLocaleString("th-TH")} บาท)`
      : "ออเดอร์นี้";
    if (!confirm(`ต้องการลบ${label} ใช่หรือไม่?`)) return;
    const remaining = orders.filter(o => String(o.id) !== String(id));
    saveOrders(remaining);
    renderHistory();
    updateSummary();
  });

  clearAllBtn.addEventListener("click", () => {
    if (confirm("ต้องการล้างรายการออเดอร์ทั้งหมดหรือไม่?")) {
      saveOrders([]);
      renderHistory();
      updateSummary();
    }
  });

  document.getElementById("saveBtn").addEventListener("click", () => {
    const total = updateTotal();
    const selectedItems = MENU
      .filter(item => qty[item.id] > 0)
      .map(item => ({ name: item.name, price: item.price, qty: qty[item.id] }));

    if (selectedItems.length === 0) {
      alert("กรุณาเลือกเมนูอย่างน้อย 1 รายการ");
      return;
    }

    const customerName = document.getElementById("customerName").value.trim();
    const customerPhone = document.getElementById("customerPhone").value.trim();

    const now = new Date();
    const timeStr = now.toLocaleString("th-TH", {
      day: "2-digit", month: "2-digit", year: "numeric",
      hour: "2-digit", minute: "2-digit"
    });

    const order = {
      id: Date.now(),
      customerName,
      customerPhone,
      items: selectedItems,
      total,
      time: timeStr,
      dateKey: todayKey()
    };

    const orders = loadOrders();
    orders.push(order);
    saveOrders(orders);

    MENU.forEach(item => qty[item.id] = 0);
    renderMenu();
    updateTotal();
    document.getElementById("customerName").value = "";
    document.getElementById("customerPhone").value = "";

    renderHistory();
    updateSummary();
  });

  renderMenu();
  updateTotal();
  renderHistory();
  updateSummary();
</script>

</body>
</html>
